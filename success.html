<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — IN | Indulgence & Nightlife</title>
  <style>
    @font-face {
      font-family: 'Ultra911';
      src: url('assets/fonts/ultra911bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #000000;
      --red: #8B0000;
      --red-bright: #c0000a;
      --white: #FFFFFF;
      --grey: #999999;
    }
    html, body {
      min-height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 500px;
      animation: fadeIn 1s ease forwards;
    }
    .monogram {
      font-family: 'Ultra911', sans-serif;
      font-size: 5rem;
      font-weight: 700;
      font-style: italic;
      color: var(--white);
      text-shadow: 0 0 60px rgba(139,0,0,0.5);
      margin-bottom: 1rem;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: var(--red);
      margin: 1.5rem auto;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    p {
      font-size: 0.9rem;
      color: var(--grey);
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: var(--red);
      color: var(--white);
      padding: 0.9rem 2rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--red-bright); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Menu toggle (hamburger) ── */
    .menu-toggle {
      position: fixed;
      top: 2rem;
      right: 2rem;
      z-index: 500;
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .menu-toggle:focus-visible {
      outline: 2px solid var(--red-bright);
      outline-offset: 4px;
    }

    .menu-toggle .bar {
      width: 26px;
      height: 2px;
      background: var(--white);
      transition: transform 0.35s cubic-bezier(0.45, 0.05, 0.55, 0.95), opacity 0.25s ease;
    }

    .menu-toggle[aria-expanded="true"] .bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] .bar:nth-child(2) { opacity: 0; }
    .menu-toggle[aria-expanded="true"] .bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    /* ── Site menu overlay ── */
    .site-menu {
      position: fixed;
      inset: 0;
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s cubic-bezier(0.45, 0.05, 0.55, 0.95);
    }

    .site-menu::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(139,0,0,0.35) 0%, transparent 65%);
      pointer-events: none;
    }

    .site-menu.is-open { opacity: 1; visibility: visible; }
    .site-menu ul { position: relative; list-style: none; text-align: center; }
    .site-menu li { margin: 1.6rem 0; }

    .site-menu a {
      font-family: 'Ultra911', sans-serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(1.8rem, 6vw, 3rem);
      letter-spacing: -0.01em;
      color: var(--white);
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .site-menu a:hover,
    .site-menu a:focus-visible { color: var(--red-bright); }

    body.menu-open { overflow: hidden; }

    @media (prefers-reduced-motion: reduce) {
      .menu-toggle .bar, .site-menu { transition: none; }
    }
  </style>
</head>
<body>
  <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="siteMenu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <nav class="site-menu" id="siteMenu" aria-label="Site navigation">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/store.html">Shop IN</a></li>
      <li><a href="https://discord.gg/VKkeJsBy" target="_blank" rel="noopener">Discord</a></li>
      <li><a href="/legal.html">Legal</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="monogram">IN</div>
    <div class="divider"></div>
    <h1>You're IN.</h1>
    <p>Your order has been confirmed and is on its way to being printed and shipped. You'll receive a confirmation email shortly with your order details.</p>
    <a href="/store.html" class="btn">Continue Shopping</a>
  </div>

  <script>
    // ── Hamburger menu ──
    const menuToggle = document.getElementById('menuToggle');
    const siteMenu = document.getElementById('siteMenu');

    function setMenu(open) {
      siteMenu.classList.toggle('is-open', open);
      menuToggle.setAttribute('aria-expanded', open);
      menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      document.body.classList.toggle('menu-open', open);
    }

    menuToggle.addEventListener('click', () => setMenu(!siteMenu.classList.contains('is-open')));

    siteMenu.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') setMenu(false);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && siteMenu.classList.contains('is-open')) setMenu(false);
    });
  </script>
</body>
</html>
