<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — IN | Indulgence & Nightlife</title>
  <style>
    @font-face {
      font-family: 'Ultra911';
      src: url('assets/fonts/ultra911bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #000000;
      --red: #8B0000;
      --red-bright: #c0000a;
      --white: #FFFFFF;
      --grey: #999999;
    }
    html, body {
      min-height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 500px;
      animation: fadeIn 1s ease forwards;
    }
    .monogram {
      font-family: 'Ultra911', sans-serif;
      font-size: 5rem;
      font-weight: 700;
      font-style: italic;
      color: var(--white);
      text-shadow: 0 0 60px rgba(139,0,0,0.5);
      margin-bottom: 1rem;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: var(--red);
      margin: 1.5rem auto;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    p {
      font-size: 0.9rem;
      color: var(--grey);
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: var(--red);
      color: var(--white);
      padding: 0.9rem 2rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--red-bright); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="monogram">IN</div>
    <div class="divider"></div>
    <h1>You're IN.</h1>
    <p>Your order has been confirmed and is on its way to being printed and shipped. You'll receive a confirmation email shortly with your order details.</p>
    <a href="/store.html" class="btn">Continue Shopping</a>
  </div>
</body>
</html>
